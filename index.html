<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malgré la distance</title>
<style>
  :root{
    --bg: #1a2038;
    --bg-deep: #12172b;
    --card: #232b4a;
    --card-border: #333d63;
    --gold: #e3b23c;
    --gold-soft: #f0cf7f;
    --rose: #e79aad;
    --text: #f2eee3;
    --text-dim: #a7afce;
    --line: #38406a;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 20% -10%, #2a3560 0%, var(--bg) 45%, var(--bg-deep) 100%);
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:.5;animation:twinkle 4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.8;}}
  @media (prefers-reduced-motion: reduce){ .star{animation:none;opacity:.35;} }

  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:28px 20px 80px;}

  header.hero{text-align:center;margin-bottom:28px;}
  .constellation{width:220px;height:70px;margin:0 auto 14px;}
  .kicker{font-family:var(--serif);font-style:italic;color:var(--text-dim);font-size:14px;letter-spacing:.02em;margin-bottom:6px;}
  h1{font-family:var(--serif);font-weight:700;font-size:38px;margin:0 0 6px;color:var(--gold-soft);}
  .subtitle{font-family:var(--serif);font-style:italic;color:var(--text-dim);font-size:16px;margin:0;}

  .progress-wrap{max-width:420px;margin:22px auto 0;}
  .progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
  .progress-track{height:6px;border-radius:4px;background:var(--card-border);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:4px;transition:width .4s ease;}

  nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:22px 0 6px;margin-bottom:8px;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1px solid var(--card-border);
    background:transparent;color:var(--text-dim);font-size:13.5px;cursor:pointer;white-space:nowrap;
    font-family:var(--sans);transition:all .15s ease;
  }
  .tab:hover{border-color:var(--gold);color:var(--text);}
  .tab.active{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:600;}

  section.panel{display:none;}
  section.panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .section-intro{font-family:var(--serif);font-style:italic;color:var(--text-dim);font-size:15px;line-height:1.6;text-align:center;max-width:560px;margin:6px auto 26px;}
  .section-head{text-align:center;margin-bottom:4px;}
  .section-head .num{font-size:12px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;}
  .section-head h2{font-family:var(--serif);font-size:26px;margin:4px 0 0;color:var(--text);}

  .card{
    background:var(--card);border:1px solid var(--card-border);border-radius:10px;
    padding:16px 18px;margin-bottom:12px;transition:border-color .15s ease;
  }
  .card.done{border-color:var(--gold);}
  .card-top{display:flex;align-items:flex-start;gap:12px;}
  .checkbox{
    flex:0 0 auto;width:21px;height:21px;border-radius:5px;border:1.5px solid var(--text-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px;
    transition:all .15s ease;background:transparent;
  }
  .checkbox.checked{background:var(--gold);border-color:var(--gold);}
  .checkbox svg{width:13px;height:13px;opacity:0;transition:opacity .1s ease;}
  .checkbox.checked svg{opacity:1;}
  .card-body{flex:1;min-width:0;}
  .card-title{font-weight:600;font-size:15px;color:var(--text);margin:0 0 4px;}
  .card-title .num{color:var(--gold);font-weight:700;margin-right:6px;}
  .card-title.done{text-decoration:line-through;color:var(--text-dim);}
  .card-desc{font-size:13.8px;line-height:1.55;color:var(--text-dim);margin:0 0 8px;}
  .card-tip{font-size:12.5px;font-style:italic;color:var(--rose);margin:0 0 10px;}
  .card-tip b{font-style:normal;font-weight:600;}
  .note-input{
    width:100%;background:var(--bg-deep);border:1px solid var(--line);border-radius:6px;color:var(--text);
    font-family:var(--sans);font-size:13px;padding:8px 10px;resize:vertical;min-height:34px;
  }
  .note-input::placeholder{color:#5c6690;}
  .note-input:focus{outline:none;border-color:var(--gold);}

  .q-theme{font-family:var(--serif);font-size:18px;color:var(--gold-soft);margin:26px 0 12px;}
  .q-theme:first-child{margin-top:0;}
  .q-card{margin-bottom:10px;}
  .q-text{font-size:14px;color:var(--text);margin:0 0 8px;line-height:1.5;}

  footer{text-align:center;margin-top:40px;color:var(--text-dim);font-size:12px;font-family:var(--serif);font-style:italic;}

  .save-note{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--gold);color:var(--text);
    padding:8px 16px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:opacity .25s ease;z-index:5;
  }
  .save-note.show{opacity:1;}

  @media (max-width:520px){
    h1{font-size:30px;}
    .wrap{padding:20px 14px 70px;}
  }
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
  <header class="hero">
    <svg class="constellation" viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg">
      <line x1="30" y1="45" x2="190" y2="25" stroke="var(--gold)" stroke-width="1" stroke-dasharray="3,4" opacity="0.6"/>
      <circle cx="30" cy="45" r="5" fill="var(--rose)"/>
      <circle cx="190" cy="25" r="5" fill="var(--gold)"/>
      <circle cx="80" cy="38" r="1.6" fill="var(--text-dim)"/>
      <circle cx="120" cy="33" r="1.6" fill="var(--text-dim)"/>
      <circle cx="150" cy="29" r="1.6" fill="var(--text-dim)"/>

    <div class="kicker">Édition longue distance</div>
    <h1>Malgré la distance</h1>
    <p class="subtitle">101 façons de rester cœur à cœur</p>
    <div class="progress-wrap">
      <div class="progress-label"><span id="prog-text">0 / 101 réalisées</span><span id="prog-pct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="panels"></div>

  <footer>Malgré la distance, vous êtes ensemble.</footer>
</div>
<div class="save-note" id="saveNote">Enregistré ✓</div>

const QUESTIONS = [
  ["Pour se redécouvrir",[
    "Quel est ton souvenir préféré de nous, et pourquoi ?",
    "Qu'est-ce que tu as appris sur toi-même depuis qu'on est ensemble ?",
    "Quelle chanson te fait penser à moi, et depuis quand ?",
    "Si tu devais décrire notre relation en trois mots, lesquels choisirais-tu ?",

  ]],
  ["Pour parler de la distance",[
    "Qu'est-ce qui te manque le plus de moi en ce moment ?",
    "Comment tu gères les moments où la distance pèse trop ?",
    "Qu'est-ce que je pourrais faire pour te faire sentir plus proche de moi ?",
    "Y a-t-il un moment récent où tu t'es senti(e) seul(e) et que tu ne m'as pas dit ?",

  ["Pour rêver ensemble",[

    "Si on pouvait vivre n'importe où pendant un an, où irait-on ?"
  ]],
  ["Pour approfondir",[

    "Comment je peux mieux te soutenir dans les moments difficiles ?",

let state = {}; // key -> {checked, note}
let activeTab = "s1";

function starsBg(){
  const el = document.getElementById('stars');
  let html = '';
  for(let i=0;i<60;i++){
    const size = Math.random()*2+1;
    const top = Math.random()*100;
    const left = Math.random()*100;
    const delay = Math.random()*4;
    html += `<div class="star" style="width:${size}px;height:${size}px;top:${top}%;left:${left}%;animation-delay:${delay}s;"></div>`;
  }
  el.innerHTML = html;
}

function checkIcon(){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#1a1200" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

async function loadState(){
  try{
    const res = await window.storage.list('', true);
    if(res && res.keys){
      for(const k of res.keys){
        try{
          const r = await window.storage.get(k, true);
          if(r) state[k] = JSON.parse(r.value);
        }catch(e){}
      }
    }
  }catch(e){ console.log('no existing state'); }
  render();
}

async function saveKey(key, value){
  state[key] = value;
  try{
    await window.storage.set(key, JSON.stringify(value), true);
    flashSaved();
  }catch(e){ console.error('save failed', e); }
}

function flashSaved(){
  const n = document.getElementById('saveNote');
  n.classList.add('show');
  clearTimeout(window._saveT);
  window._saveT = setTimeout(()=>n.classList.remove('show'), 1200);
}

function toggleActivity(num){
  const key = `activity:${num}`;
  const cur = state[key] || {checked:false, note:''};
  cur.checked = !cur.checked;
  saveKey(key, cur);
  updateProgress();
  render();
}

function updateNote(key, val){
  const cur = state[key] || {checked:false, note:''};
  cur.note = val;
  saveKey(key, cur);
}

function updateProgress(){
  let done = 0;
  for(let i=1;i<=101;i++){
    if(state[`activity:${i}`] && state[`activity:${i}`].checked) done++;
  }
  const pct = Math.round(done/101*100);
  document.getElementById('prog-text').textContent = `${done} / 101 réalisées`;
  document.getElementById('prog-pct').textContent = `${pct}%`;
  document.getElementById('prog-fill').style.width = `${pct}%`;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  let html = '';
  SECTIONS.forEach(s=>{
    html += `<button class="tab ${activeTab==='s'+s.num?'active':''}" onclick="setTab('s${s.num}')">${s.num}. ${s.title}</button>`;
  });
  html += `<button class="tab ${activeTab==='questions'?'active':''}" onclick="setTab('questions')">Questions de couple</button>`;
  tabs.innerHTML = html;
}

function setTab(id){
  activeTab = id;
  render();
}

function activityCard(num, title, desc, tip){
  const key = `activity:${num}`;
  const st = state[key] || {checked:false, note:''};
  return `
    <div class="card ${st.checked?'done':''}">
      <div class="card-top">
        <div class="checkbox ${st.checked?'checked':''}" onclick="toggleActivity(${num})">${checkIcon()}</div>
        <div class="card-body">
          <p class="card-title ${st.checked?'done':''}"><span class="num">#${num}</span>${title}</p>
          <p class="card-desc">${desc}</p>
          <p class="card-tip"><b>Astuce —</b> ${tip}</p>
          <textarea class="note-input" placeholder="Notre note sur ce moment (optionnel)..." onchange="updateNote('${key}', this.value)">${st.note||''}</textarea>
        </div>
      </div>
    </div>`;
}

function questionCard(themeIdx, qIdx, text){
  const key = `answer:${themeIdx}:${qIdx}`;
  const st = state[key] || {note:''};
  return `
    <div class="q-card">
      <p class="q-text">— ${text}</p>
      <textarea class="note-input" placeholder="Vos réponses..." onchange="updateNote('${key}', this.value)">${st.note||''}</textarea>
    </div>`;
}

function render(){
  renderTabs();
  const panels = document.getElementById('panels');
  if(activeTab === 'questions'){
    let html = `<section class="panel active">
      <div class="section-head"><div class="num">Bonus</div><h2>Questions de couple</h2></div>
      <p class="section-intro">À utiliser lors de vos appels, dîners virtuels, ou juste comme ça, un soir de manque.</p>`;
    QUESTIONS.forEach((theme, tIdx)=>{
      html += `<div class="q-theme">${theme[0]}</div>`;
      theme[1].forEach((q, qIdx)=>{
        html += questionCard(tIdx, qIdx, q);
      });
    });
    html += `</section>`;
    panels.innerHTML = html;
  } else {
    const s = SECTIONS.find(sec => 's'+sec.num === activeTab);
    let html = `<section class="panel active">
      <div class="section-head"><div class="num">Section ${s.num}</div><h2>${s.title}</h2></div>
      <p class="section-intro">${s.intro}</p>`;
    s.acts.forEach(a=>{
      html += activityCard(a[0], a[1], a[2], a[3]);
    });
    html += `</section>`;
    panels.innerHTML = html;
  }
}

starsBg();
updateProgress();
loadState();
</script>
